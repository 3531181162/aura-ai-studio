<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA · AI电商视觉工作台</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ── 登录页专属样式 ── */
body { overflow: hidden; }

.login-bg {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(201,169,110,.08) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 80% 100%, rgba(201,169,110,.05) 0%, transparent 60%),
    var(--bg-0);
}

/* 动态线条背景 */
.grid-lines {
  position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(201,169,110,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,110,.04) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
}

/* 中心容器 */
.login-wrap {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex;
}

/* 左侧品牌区 */
.brand-side {
  flex: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-start;
  padding: 80px;
  position: relative;
}
.brand-eyebrow {
  font-size: .75rem; font-weight: 600;
  color: var(--gold);
  letter-spacing: .2em; text-transform: uppercase;
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 10px;
}
.brand-eyebrow::before {
  content: '';
  width: 32px; height: 1px;
  background: var(--gold);
}
.brand-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.5rem, 4vw, 3.8rem);
  font-weight: 700;
  line-height: 1.15;
  color: var(--text-1);
  margin-bottom: 20px;
}
.brand-title span {
  background: linear-gradient(135deg, var(--gold-dk), var(--gold), var(--gold-lt));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand-desc {
  font-size: 1.05rem; color: var(--text-2); line-height: 1.8;
  max-width: 440px; margin-bottom: 40px;
}
.brand-features {
  display: flex; flex-direction: column; gap: 12px;
}
.brand-feat {
  display: flex; align-items: center; gap: 12px;
  font-size: .9rem; color: var(--text-2);
}
.feat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); flex-shrink: 0;
  box-shadow: 0 0 8px var(--gold);
}

/* 右侧登录卡片 */
.login-side {
  width: 440px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 40px;
  background: rgba(14,12,18,.6);
  backdrop-filter: blur(20px);
  border-left: 1px solid var(--gold-bdr2);
}
.login-card {
  width: 100%; max-width: 360px;
}
.login-logo {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 36px;
}
.logo-icon {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--gold-dim), var(--gold));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  box-shadow: 0 0 20px rgba(201,169,110,.3);
}
.logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem; font-weight: 700;
  color: var(--gold-lt);
}
.logo-sub { font-size: .75rem; color: var(--text-3); }

.login-heading {
  font-size: 1.3rem; font-weight: 600;
  color: var(--text-1); margin-bottom: 6px;
}
.login-subheading { font-size: .88rem; color: var(--text-3); margin-bottom: 28px; }

/* Tab 切换 */
.auth-tabs {
  display: flex; gap: 0;
  background: var(--bg-1);
  border-radius: var(--radius-sm);
  padding: 3px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1; padding: 8px;
  border: none; background: transparent;
  border-radius: 6px;
  color: var(--text-3); font-size: .88rem; font-weight: 500;
  cursor: pointer; transition: var(--trans);
  font-family: inherit;
}
.auth-tab.active {
  background: var(--bg-3);
  color: var(--gold);
}

/* 分隔线 */
.divider {
  display: flex; align-items: center; gap: 12px;
  font-size: .78rem; color: var(--text-3);
  margin: 20px 0;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px;
  background: var(--gold-bdr2);
}

.login-footer {
  margin-top: 24px;
  font-size: .78rem; color: var(--text-3);
  text-align: center; line-height: 1.8;
}
.login-footer a { color: var(--gold); text-decoration: none; }

/* 错误提示 */
.alert {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: .85rem;
  margin-bottom: 16px;
  display: none;
}
.alert-error { background: rgba(224,80,80,.1); border: 1px solid rgba(224,80,80,.2); color: var(--red); }
.alert-success { background: rgba(80,200,120,.1); border: 1px solid rgba(80,200,120,.2); color: var(--green); }

/* 装饰光圈 */
.orb {
  position: absolute; border-radius: 50%; pointer-events: none;
  animation: pulse-orb 8s ease-in-out infinite;
}
.orb-1 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(201,169,110,.07), transparent 70%);
  top: 10%; left: 10%;
  animation-delay: 0s;
}
.orb-2 {
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(201,169,110,.05), transparent 70%);
  bottom: 20%; right: 30%;
  animation-delay: 3s;
}
@keyframes pulse-orb {
  0%, 100% { transform: scale(1); opacity: .6; }
  50% { transform: scale(1.2); opacity: 1; }
}

@media (max-width: 900px) {
  .brand-side { display: none; }
  .login-side { width: 100%; border-left: none; }
}
</style>
</head>
<body>

<div class="login-bg"></div>
<div class="grid-lines"></div>

<!-- 粒子背景 -->
<div class="particles-bg" id="particles"></div>

<div class="login-wrap">

  <!-- 左侧品牌 -->
  <div class="brand-side">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="brand-eyebrow">AI Visual Studio</div>

    <h1 class="brand-title">
      电商视觉<br>
      <span>智能创作</span><br>
      工作台
    </h1>

    <p class="brand-desc">
      一站式 AI 驱动的电商图片生成平台，<br>
      模特图、场景图、主图文案，一键生成。
    </p>

    <div class="brand-features">
      <div class="brand-feat"><div class="feat-dot"></div>AI模特图生成，输入关键词秒出效果</div>
      <div class="brand-feat"><div class="feat-dot"></div>产品图智能换背景，多场景一键切换</div>
      <div class="brand-feat"><div class="feat-dot"></div>电商文案自动生成，标题卖点全覆盖</div>
      <div class="brand-feat"><div class="feat-dot"></div>批量SKU处理，提升10倍工作效率</div>
      <div class="brand-feat"><div class="feat-dot"></div>团队协作管理，用量实时可视化</div>
    </div>
  </div>

  <!-- 右侧登录 -->
  <div class="login-side">
    <div class="login-card">

      <div class="login-logo">
        <div class="logo-icon">✦</div>
        <div>
          <div class="logo-text">AURA</div>
          <div class="logo-sub">AI电商视觉工作台</div>
        </div>
      </div>

      <h2 class="login-heading">欢迎回来</h2>
      <p class="login-subheading">登录您的账号，开始创作</p>

      <!-- Tab -->
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">登 录</button>
        <button class="auth-tab" onclick="switchTab('register')">注 册</button>
      </div>

      <!-- 提示 -->
      <div class="alert alert-error" id="alert-msg"></div>

      <!-- 登录表单 -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>邮箱地址</label>
          <input class="input" type="email" id="login-email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="input" type="password" id="login-pwd" placeholder="••••••••" required>
        </div>
        <button class="btn btn-gold btn-lg btn-block" type="submit" id="login-btn">
          <span>登录工作台</span>
        </button>
      </form>

      <!-- 注册表单 -->
      <form id="register-form" style="display:none" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>姓名 / 昵称</label>
          <input class="input" type="text" id="reg-name" placeholder="你的名字" required>
        </div>
        <div class="form-group">
          <label>邮箱地址</label>
          <input class="input" type="email" id="reg-email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>设置密码</label>
          <input class="input" type="password" id="reg-pwd" placeholder="至少8位" required minlength="8">
        </div>
        <div class="form-group">
          <label>邀请码（必填）</label>
          <input class="input" type="text" id="reg-code" placeholder="联系管理员获取" required>
        </div>
        <button class="btn btn-gold btn-lg btn-block" type="submit" id="reg-btn">
          <span>创建账号</span>
        </button>
      </form>

      <div class="login-footer">
        使用即代表同意 <a href="#">服务条款</a> 与 <a href="#">隐私政策</a><br>
        如有问题请联系管理员
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script>
// ── 粒子生成 ──
(function() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left: ${Math.random()*100}%;
      width: ${Math.random()*3+1}px;
      height: ${Math.random()*3+1}px;
      animation-duration: ${Math.random()*15+10}s;
      animation-delay: ${Math.random()*10}s;
      opacity: ${Math.random()*.4+.1};
    `;
    container.appendChild(p);
  }
})();

// ── Tab 切换 ──
function switchTab(tab) {
  const tabs = document.querySelectorAll('.auth-tab');
  tabs[0].classList.toggle('active', tab === 'login');
  tabs[1].classList.toggle('active', tab === 'register');
  document.getElementById('login-form').style.display = tab === 'login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
  clearAlert();
}

function showAlert(msg, type='error') {
  const el = document.getElementById('alert-msg');
  el.textContent = msg;
  el.className = `alert alert-${type}`;
  el.style.display = 'block';
}
function clearAlert() {
  document.getElementById('alert-msg').style.display = 'none';
}
function setLoading(btnId, loading, text='') {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.querySelector('span').textContent = loading ? '请稍候...' : text;
}

// ── 登录 ──
async function handleLogin(e) {
  e.preventDefault();
  clearAlert();
  const email = document.getElementById('login-email').value.trim();
  const pwd   = document.getElementById('login-pwd').value;
  setLoading('login-btn', true);

  try {
    const { data, error } = await window._supabase.auth.signInWithPassword({ email, password: pwd });
    if (error) throw error;

    // 检查账号是否被禁用
    const { data: profile } = await window._supabase
      .from('profiles').select('role,is_active').eq('id', data.user.id).single();

    if (profile && !profile.is_active) {
      await window._supabase.auth.signOut();
      throw new Error('账号已被停用，请联系管理员');
    }

    // 跳转
    if (profile && profile.role === 'admin') {
      window.location.href = '/admin.html';
    } else {
      window.location.href = '/app.html';
    }
  } catch(err) {
    showAlert(err.message === 'Invalid login credentials' ? '邮箱或密码错误' : err.message);
    setLoading('login-btn', false, '登录工作台');
  }
}

// ── 注册 ──
async function handleRegister(e) {
  e.preventDefault();
  clearAlert();
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pwd   = document.getElementById('reg-pwd').value;
  const code  = document.getElementById('reg-code').value.trim();
  setLoading('reg-btn', true);

  try {
    // 验证邀请码
    const { data: codeData } = await window._supabase
      .from('invite_codes').select('*').eq('code', code).eq('used', false).single();
    if (!codeData) throw new Error('邀请码无效或已使用');

    // 创建账号
    const { data, error } = await window._supabase.auth.signUp({ email, password: pwd });
    if (error) throw error;

    // 创建 profile
    await window._supabase.from('profiles').insert({
      id: data.user.id, email, nickname: name,
      role: 'user', is_active: true, daily_limit: 20
    });

    // 标记邀请码已使用
    await window._supabase.from('invite_codes').update({ used: true, used_by: data.user.id }).eq('code', code);

    showAlert('注册成功！请查收验证邮件后登录', 'success');
    setTimeout(() => switchTab('login'), 2000);
  } catch(err) {
    showAlert(err.message);
    setLoading('reg-btn', false, '创建账号');
  }
}

// ── 检查是否已登录 ──
(async function() {
  if (!window._supabase) return;
  const { data } = await window._supabase.auth.getSession();
  if (data.session) {
    const { data: profile } = await window._supabase
      .from('profiles').select('role').eq('id', data.session.user.id).single();
    window.location.href = profile?.role === 'admin' ? '/admin.html' : '/app.html';
  }
})();
</script>
</body>
</html>
