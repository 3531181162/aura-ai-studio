<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA · AI电商视觉工作台</title>
<link rel="stylesheet" href="css/style.css">
<style>
/* ================================================================
   登录页专属样式 — AURA AI VISUAL STUDIO
   纯黑科技大厂感 / OpenAI · Apple · ByteDance 调性
   ================================================================ */

body { overflow: hidden; }

/* ── 背景层 ── */
.page-bg {
  position: fixed; inset: 0; z-index: 0;
  background: #000000;
}

/* 网格线 — 极细 */
.grid-overlay {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 80px 80px;
  animation: grid-scroll 20s linear infinite;
}
@keyframes grid-scroll {
  0%   { background-position: 0 0; }
  100% { background-position: 0 80px; }
}

/* 顶部扫描线 */
.scanline {
  position: fixed; top: 0; left: 0; right: 0; z-index: 2;
  height: 2px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(201,169,110,0.6) 40%,
    rgba(201,169,110,0.9) 50%,
    rgba(201,169,110,0.6) 60%,
    transparent 100%);
  animation: scan 4s ease-in-out infinite;
  box-shadow: 0 0 12px rgba(201,169,110,0.5), 0 0 24px rgba(201,169,110,0.2);
}
@keyframes scan {
  0%   { transform: translateX(-100%); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateX(100%); opacity: 0; }
}

/* 右下角金色光晕 */
.corner-glow {
  position: fixed; bottom: -80px; right: -80px; z-index: 1;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle,
    rgba(201,169,110,0.12) 0%,
    rgba(201,169,110,0.04) 40%,
    transparent 70%);
  animation: glow-pulse 6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes glow-pulse {
  0%, 100% { transform: scale(1);   opacity: 0.7; }
  50%       { transform: scale(1.15); opacity: 1;   }
}

/* ── 整体布局 ── */
.login-wrap {
  position: relative; z-index: 10;
  min-height: 100vh;
  display: flex;
}

/* ================================================================
   左侧品牌区 — 60%
   ================================================================ */
.brand-side {
  flex: 0 0 60%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: flex-start;
  padding: 0 80px 0 100px;
  position: relative; overflow: hidden;
  animation: slide-in-left 0.9s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slide-in-left {
  from { opacity: 0; transform: translateX(-30px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* 顶部 AURA logo */
.brand-logo {
  position: absolute; top: 48px; left: 100px;
  display: flex; align-items: center; gap: 10px;
}
.brand-logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #a8854a, #C9A96E, #dfc28d);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #000;
  box-shadow: 0 0 16px rgba(201,169,110,0.35);
  flex-shrink: 0;
}
.brand-logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem; font-weight: 700;
  color: #dfc28d; letter-spacing: 0.05em;
}

/* 品牌内容区 */
.brand-content { max-width: 560px; }

/* 小标签 */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 0.72rem; font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.28em; text-transform: uppercase;
  margin-bottom: 28px;
  opacity: 0;
  animation: fade-up 0.7s 0.3s cubic-bezier(.16,1,.3,1) forwards;
}
.eyebrow-line {
  width: 28px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
}

/* 大标题 */
.brand-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.8rem, 4.2vw, 4rem);
  font-weight: 700;
  line-height: 1.12;
  color: #ffffff;
  margin-bottom: 24px;
}
.brand-title .line-1 {
  display: block;
  opacity: 0;
  animation: fade-up 0.7s 0.45s cubic-bezier(.16,1,.3,1) forwards;
}
.brand-title .line-2 {
  display: block;
  background: linear-gradient(135deg, #a8854a 0%, #C9A96E 40%, #dfc28d 70%, #C9A96E 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  opacity: 0;
  animation: fade-up 0.7s 0.6s cubic-bezier(.16,1,.3,1) forwards;
  background-size: 200% 100%;
  animation: fade-up 0.7s 0.6s cubic-bezier(.16,1,.3,1) forwards,
             shimmer 4s 1.5s linear infinite;
}
.brand-title .line-3 {
  display: block;
  opacity: 0;
  animation: fade-up 0.7s 0.75s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes fade-up {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0%   { background-position: 200% center; }
  100% { background-position: -200% center; }
}

/* 副标题 */
.brand-desc {
  font-size: 0.95rem; color: var(--text-secondary);
  line-height: 1.85; max-width: 440px;
  margin-bottom: 44px;
  opacity: 0;
  animation: fade-up 0.7s 0.9s cubic-bezier(.16,1,.3,1) forwards;
}

/* 功能列表 */
.brand-features {
  display: flex; flex-direction: column; gap: 14px;
  opacity: 0;
  animation: fade-up 0.7s 1.05s cubic-bezier(.16,1,.3,1) forwards;
}
.brand-feat {
  display: flex; align-items: center; gap: 14px;
  font-size: 0.88rem; color: var(--text-secondary);
  transition: color var(--transition);
}
.brand-feat:hover { color: var(--text-primary); }
.feat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold); flex-shrink: 0;
  box-shadow: 0 0 10px rgba(201,169,110,0.8), 0 0 20px rgba(201,169,110,0.3);
}
.feat-text strong {
  color: rgba(255,255,255,0.85); font-weight: 500;
}

/* 装饰水印数字 */
.watermark {
  position: absolute; bottom: 40px; right: -20px;
  font-family: 'Playfair Display', serif;
  font-size: 18rem; font-weight: 700; line-height: 1;
  color: rgba(201,169,110,0.025);
  pointer-events: none; user-select: none;
  letter-spacing: -0.05em;
}

/* 装饰光球 */
.orb {
  position: absolute; border-radius: 50%; pointer-events: none;
}
.orb-1 {
  width: 360px; height: 360px; top: 5%; left: -60px;
  background: radial-gradient(circle, rgba(201,169,110,0.06) 0%, transparent 70%);
  animation: orb-float 10s ease-in-out infinite;
}
.orb-2 {
  width: 220px; height: 220px; bottom: 15%; left: 40%;
  background: radial-gradient(circle, rgba(201,169,110,0.04) 0%, transparent 70%);
  animation: orb-float 13s 2s ease-in-out infinite reverse;
}
@keyframes orb-float {
  0%, 100% { transform: translateY(0) scale(1); }
  50%       { transform: translateY(-24px) scale(1.05); }
}

/* ================================================================
   右侧登录卡片区 — 40%，毛玻璃
   ================================================================ */
.login-side {
  flex: 0 0 40%;
  display: flex; align-items: center; justify-content: center;
  padding: 48px 48px;
  background: rgba(8,8,8,0.80);
  backdrop-filter: blur(24px) saturate(120%);
  border-left: 1px solid rgba(201,169,110,0.10);
  position: relative;
  animation: slide-in-right 0.9s 0.1s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slide-in-right {
  from { opacity: 0; transform: translateX(30px); }
  to   { opacity: 1; transform: translateX(0); }
}

.login-card {
  width: 100%; max-width: 380px;
}

/* 卡片顶部 logo */
.card-logo {
  display: flex; align-items: center; gap: 11px;
  margin-bottom: 40px;
}
.card-logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, #a8854a, #C9A96E, #dfc28d);
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: #000;
  box-shadow: 0 0 20px rgba(201,169,110,0.30), 0 4px 12px rgba(0,0,0,0.5);
  flex-shrink: 0;
}
.card-logo-text {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; font-weight: 700;
  color: #dfc28d; letter-spacing: 0.05em;
  line-height: 1;
}
.card-logo-sub {
  font-size: 0.72rem; color: var(--text-muted);
  letter-spacing: 0.05em; margin-top: 3px;
}

/* 欢迎标题 */
.card-heading {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem; font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 6px; letter-spacing: -0.01em;
}
.card-subheading {
  font-size: 0.875rem; color: var(--text-muted);
  margin-bottom: 28px;
}

/* Tab 切换 */
.auth-tabs {
  display: flex;
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 3px; gap: 3px;
  margin-bottom: 24px;
}
.auth-tab {
  flex: 1; padding: 9px 16px;
  border: none; background: transparent;
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 0.875rem; font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  font-family: var(--font-body);
  letter-spacing: 0.03em;
}
.auth-tab:hover:not(.active) {
  color: var(--text-secondary);
  background: var(--bg-hover);
}
.auth-tab.active {
  background: linear-gradient(135deg, rgba(168,133,74,0.25), rgba(201,169,110,0.15));
  color: var(--gold);
  border: 1px solid rgba(201,169,110,0.2);
  box-shadow: 0 1px 8px rgba(0,0,0,0.4);
}

/* 提示框 */
.alert {
  padding: 11px 14px;
  border-radius: var(--radius-md);
  font-size: 0.84rem; line-height: 1.5;
  margin-bottom: 16px;
  display: none;
}
.alert-error {
  background: rgba(255,59,48,0.08);
  border: 1px solid rgba(255,59,48,0.20);
  color: #ff6b6b;
}
.alert-success {
  background: rgba(52,199,89,0.08);
  border: 1px solid rgba(52,199,89,0.20);
  color: #4cd964;
}

/* 表单字段 */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 0.8rem; font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 7px;
  letter-spacing: 0.03em;
}
.input {
  display: block; width: 100%;
  padding: 11px 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 0.9rem;
  outline: none;
  transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
  -webkit-appearance: none;
}
.input::placeholder { color: var(--text-muted); }
.input:hover {
  border-color: var(--border-strong);
  background: rgba(255,255,255,0.04);
}
.input:focus {
  border-color: rgba(201,169,110,0.5);
  background: rgba(201,169,110,0.04);
  box-shadow: 0 0 0 3px rgba(201,169,110,0.08);
}

/* 金色按钮 */
.btn-submit {
  display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 13px 24px;
  margin-top: 8px;
  background: linear-gradient(135deg, #a8854a 0%, #C9A96E 50%, #dfc28d 100%);
  background-size: 200% 100%;
  border: none; border-radius: var(--radius-md);
  color: #000000;
  font-size: 0.9rem; font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.3s var(--ease);
  position: relative; overflow: hidden;
  box-shadow: 0 2px 16px rgba(201,169,110,0.25), 0 1px 4px rgba(0,0,0,0.4);
}
.btn-submit::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
  opacity: 0; transition: opacity var(--transition);
}
.btn-submit:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(201,169,110,0.4), 0 2px 8px rgba(0,0,0,0.5);
  background-position: 100% 0;
}
.btn-submit:hover::after { opacity: 1; }
.btn-submit:active:not(:disabled) {
  transform: translateY(0);
  box-shadow: 0 2px 12px rgba(201,169,110,0.25);
}
.btn-submit:disabled {
  opacity: 0.55; cursor: not-allowed;
  transform: none; box-shadow: none;
}
.btn-submit .btn-icon {
  margin-left: 8px; font-size: 1rem;
  transition: transform var(--transition);
}
.btn-submit:hover .btn-icon { transform: translateX(3px); }

/* 页脚 */
.card-footer {
  margin-top: 22px;
  font-size: 0.76rem; color: var(--text-muted);
  text-align: center; line-height: 1.9;
}
.card-footer a {
  color: rgba(201,169,110,0.7);
  transition: color var(--transition);
}
.card-footer a:hover { color: var(--gold); }

/* ── 响应式 ── */
@media (max-width: 960px) {
  .brand-side { display: none; }
  .login-side {
    flex: 0 0 100%;
    border-left: none;
    background: #000;
    backdrop-filter: none;
  }
}
@media (max-width: 480px) {
  .login-side { padding: 32px 24px; }
}
</style>
</head>
<body>

<!-- ── 背景层 ── -->
<div class="page-bg"></div>
<div class="grid-overlay"></div>
<div class="scanline"></div>
<div class="corner-glow"></div>

<!-- ── 主布局 ── -->
<div class="login-wrap">

  <!-- ════════ 左侧品牌区 ════════ -->
  <div class="brand-side">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- 顶部 logo -->
    <div class="brand-logo">
      <div class="brand-logo-icon">✦</div>
      <div class="brand-logo-text">AURA</div>
    </div>

    <!-- 核心内容 -->
    <div class="brand-content">

      <div class="eyebrow">
        <span class="eyebrow-line"></span>
        AI VISUAL STUDIO
      </div>

      <h1 class="brand-title">
        <span class="line-1">电商视觉</span>
        <span class="line-2">AI驱动</span>
        <span class="line-3">一体化工作台</span>
      </h1>

      <p class="brand-desc">
        一站式 AI 驱动的电商视觉生产平台，<br>
        从模特图到详情页，从主图到文案，<br>
        全链路智能生成，重塑创作效率。
      </p>

      <div class="brand-features">
        <div class="brand-feat">
          <div class="feat-dot"></div>

        </div>
        <div class="brand-feat">

          <div class="feat-text">
            <strong>详情页一键生成</strong>，分屏结构自动排版

        </div>
        <div class="brand-feat">
          <div class="feat-dot"></div>

            <strong>电商文案智能生成</strong>，多平台适配
          </div>
        </div>
      </div>
    </div>

    <!-- 装饰水印 -->
    <div class="watermark">04</div>
  </div>

  <!-- ════════ 右侧登录区 ════════ -->
  <div class="login-side">
    <div class="login-card">

      <!-- 卡片 logo -->
      <div class="card-logo">
        <div class="card-logo-icon">✦</div>
        <div>
          <div class="card-logo-text">AURA</div>
          <div class="card-logo-sub">AI 电商视觉工作台</div>
        </div>
      </div>

      <h2 class="card-heading">欢迎回来</h2>
      <p class="card-subheading">登录您的账号，开始创作</p>

      <!-- Tab 切换 -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">登 录</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script>
/* ================================================================
   AURA 登录页交互逻辑
   ================================================================ */

// ── 工具函数 ──────────────────────────────────────────────────
function showAlert(msg, type = 'error') {
  const el = document.getElementById('alert-msg');
  el.textContent = msg;
  el.className = 'alert alert-' + type;
  el.style.display = 'block';
}
function clearAlert() {
  const el = document.getElementById('alert-msg');
  el.style.display = 'none';
  el.className = 'alert';
}

function setLoading(formType, loading) {
  if (formType === 'login') {
    const btn = document.getElementById('login-btn');
    const txt = document.getElementById('login-btn-text');
    btn.disabled = loading;
    txt.textContent = loading ? '正在登录...' : '登录工作台';
  } else {
    const btn = document.getElementById('reg-btn');
    const txt = document.getElementById('reg-btn-text');
    btn.disabled = loading;
    txt.textContent = loading ? '正在注册...' : '创建账号';
  }
}

function translateError(msg) {
  const map = {
    'Invalid login credentials': '邮箱或密码错误，请重试',
    'Email not confirmed': '请先验证您的邮箱',
    'User already registered': '该邮箱已注册，请直接登录',
    'Password should be at least 6 characters': '密码至少需要6位',
  };
  return map[msg] || msg;
}

// ── Tab 切换 ──────────────────────────────────────────────────
function switchTab(tab) {
  const loginForm = document.getElementById('login-form');
  const regForm   = document.getElementById('register-form');
  const tabLogin  = document.getElementById('tab-login');
  const tabReg    = document.getElementById('tab-register');

  clearAlert();

  if (tab === 'login') {
    loginForm.style.display = '';
    regForm.style.display   = 'none';
    tabLogin.classList.add('active');
    tabReg.classList.remove('active');
    document.querySelector('.card-heading').textContent = '欢迎回来';
    document.querySelector('.card-subheading').textContent = '登录您的账号，开始创作';
  } else {
    loginForm.style.display = 'none';
    regForm.style.display   = '';
    tabLogin.classList.remove('active');
    tabReg.classList.add('active');
    document.querySelector('.card-heading').textContent = '创建账号';
    document.querySelector('.card-subheading').textContent = '填写信息完成注册';
  }
}

// ── 登录 ──────────────────────────────────────────────────────
async function handleLogin(e) {
  e.preventDefault();
  clearAlert();

  const sb       = window._supabase;
  if (!sb) { showAlert('服务初始化失败，请刷新页面'); return; }

  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-pwd').value;
  setLoading('login', true);

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    // 检查 profile 角色与状态
    const { data: profile, error: pErr } = await sb
      .from('profiles')
      .select('role, is_active')
      .eq('id', data.user.id)
      .single();

    if (pErr && pErr.code !== 'PGRST116') {
      console.warn('获取 profile 失败', pErr);
    }

    if (profile && profile.is_active === false) {
      await sb.auth.signOut();
      throw new Error('账号已被停用，请联系管理员');
    }

    // 跳转
    if (profile && profile.role === 'admin') {
      window.location.href = '/admin.html';
    } else {
      window.location.href = '/app.html';
    }
  } catch (err) {
    showAlert(translateError(err.message));
    setLoading('login', false);
  }
}

// ── 注册 ──────────────────────────────────────────────────────
async function handleRegister(e) {
  e.preventDefault();
  clearAlert();

  const sb   = window._supabase;
  if (!sb) { showAlert('服务初始化失败，请刷新页面'); return; }

  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pwd   = document.getElementById('reg-pwd').value;
  const code  = document.getElementById('reg-code').value.trim().toUpperCase();
  setLoading('register', true);

  try {
    // 1. 验证邀请码
    const { data: codeRow, error: codeErr } = await sb
      .from('invite_codes')
      .select('*')
      .eq('code', code)
      .eq('used', false)
      .single();

    if (codeErr || !codeRow) {
      throw new Error('邀请码无效或已使用，请联系管理员获取');
    }

    // 2. 注册账号
    const { data, error: signUpErr } = await sb.auth.signUp({ email, password: pwd });
    if (signUpErr) throw signUpErr;

    const userId = data.user?.id;
    if (!userId) throw new Error('注册失败，请重试');

    // 3. 创建 profile 记录
    const { error: profileErr } = await sb.from('profiles').insert({
      id:          userId,
      email:       email,
      nickname:    name,
      role:        'user',
      is_active:   true,
      daily_limit: 20,
    });
    if (profileErr) console.warn('创建 profile 失败', profileErr);

    // 4. 标记邀请码已使用
    await sb.from('invite_codes')
      .update({ used: true, used_by: userId })
      .eq('code', code);

    showAlert('注册成功！请查收验证邮件，确认后即可登录', 'success');
    setTimeout(() => switchTab('login'), 2500);
  } catch (err) {
    showAlert(translateError(err.message));
    setLoading('register', false);
  }
}

// ── 检查是否已登录（页面加载时） ─────────────────────────────
(async function checkSession() {
  const sb = window._supabase;
  if (!sb) return;

  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) return;

    const uid = data.session.user.id;
    const { data: profile } = await sb
      .from('profiles').select('role').eq('id', uid).single();

    window.location.href = profile?.role === 'admin' ? '/admin.html' : '/app.html';
  } catch (err) {
    console.warn('会话检查失败', err);
  }
})();
</script>
